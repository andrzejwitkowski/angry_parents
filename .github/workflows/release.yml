name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval \"db.adminCommand('ping')\""
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build application
        run: bun run build

      - name: Run unit tests
        run: bun run test

      - name: Run integration tests
        run: bun run test:integration

      - name: Run backend e2e tests
        run: bun run test:e2e

      - name: Fetch latest tag
        id: latest-tag
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "value=${tag}" >> "$GITHUB_OUTPUT"

      - name: Calculate release bump
        id: bump
        env:
          LAST_TAG: ${{ steps.latest-tag.outputs.value }}
        run: |
          if [ -n "$LAST_TAG" ]; then
            range="${LAST_TAG}..HEAD"
          else
            range="HEAD"
          fi

          echo "range=${range}" >> "$GITHUB_OUTPUT"
          echo "value=$(bun run release:bump ${range})" >> "$GITHUB_OUTPUT"

      - name: Stop when no releasable commits exist
        if: ${{ steps.bump.outputs.value == 'none' }}
        run: echo "No release needed for this push."

      - name: Compute next version
        if: ${{ steps.bump.outputs.value != 'none' }}
        id: next-version
        env:
          LAST_TAG: ${{ steps.latest-tag.outputs.value }}
          RELEASE_BUMP: ${{ steps.bump.outputs.value }}
        run: |
          if [ -n "$LAST_TAG" ]; then
            current_version=${LAST_TAG#v}
          else
            current_version=$(node -p "require('./package.json').version")
          fi
          next_version=$(bun scripts/release/versioning.ts next-version "$current_version" "$RELEASE_BUMP")
          echo "current=${current_version}" >> "$GITHUB_OUTPUT"
          echo "value=${next_version}" >> "$GITHUB_OUTPUT"

      - name: Update package version
        if: ${{ steps.bump.outputs.value != 'none' }}
        env:
          NEXT_VERSION: ${{ steps.next-version.outputs.value }}
        run: bun scripts/release/set-package-version.ts "$NEXT_VERSION"

      - name: Validate released main version
        if: ${{ steps.bump.outputs.value != 'none' }}
        env:
          NEXT_VERSION: ${{ steps.next-version.outputs.value }}
        run: bun run version:check --branch main --version "$NEXT_VERSION"

      - name: Commit release version
        if: ${{ steps.bump.outputs.value != 'none' }}
        env:
          NEXT_VERSION: ${{ steps.next-version.outputs.value }}
        run: |
          git add package.json package-lock.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore(release): v${NEXT_VERSION}"

      - name: Create git tag
        if: ${{ steps.bump.outputs.value != 'none' }}
        env:
          NEXT_VERSION: ${{ steps.next-version.outputs.value }}
        run: git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "v${NEXT_VERSION}" -m "Release v${NEXT_VERSION}"

      - name: Push release commit and tag
        if: ${{ steps.bump.outputs.value != 'none' }}
        run: git push origin HEAD:main --follow-tags
