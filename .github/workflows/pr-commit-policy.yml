name: PR Commit Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  commit-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint commit messages in PR range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git log "${BASE_SHA}..${HEAD_SHA}" '--format=%H %s' && bun scripts/release/commit-policy.ts check-range "${BASE_SHA}..${HEAD_SHA}"

      - name: Validate snapshot version on PR branch
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: bun run version:check

      - name: Detect release bump for PR
        id: bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "value=$(bun run release:bump "${BASE_SHA}..${HEAD_SHA}")" >> "$GITHUB_OUTPUT"

      - name: Write PR summary
        env:
          RELEASE_BUMP: ${{ steps.bump.outputs.value }}
        run: |
          {
            echo "## Commit policy"
            echo "- Conventional Commit policy: pass"
            echo "- Expected release bump: ${RELEASE_BUMP}"
          } >> "$GITHUB_STEP_SUMMARY"
